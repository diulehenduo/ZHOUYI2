server:
  port: 8080

spring:
  application:
    name: ZHOUYI2
  # 从项目根目录 .env 文件加载环境变量
  config:
    import: optional:file:.env[.properties]

  # ===== 数据源配置 =====
  datasource:
    url: jdbc:mysql://localhost:3306/zhouyi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# ===== 大模型配置（OpenAI 兼容格式） =====
llm:
  # API 地址（DeepSeek 用 /chat/completions，OpenAI 用 /v1/chat/completions）
  api-url: https://api.deepseek.com/chat/completions
  # API Key — 通过 .env 文件或环境变量注入
  api-key: ${LLM_API_KEY}
  # 模型名称（DeepSeek: deepseek-chat / deepseek-reasoner）
  model: deepseek-v4-pro
  # 生成温度 (0.0~1.0)
  temperature: 1.0
  # 最大输出 Token 数
  max-tokens: 10000
  # 请求超时（秒）
  connect-timeout: 10
  read-timeout: 30

# ===== JWT 配置 =====
jwt:
  # 签名密钥（生产环境请修改为随机密钥）
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-change-in-production}
  # Access Token 有效期（毫秒）- 1 小时
  access-token-expiration: 3600000
  # Refresh Token 有效期（毫秒）- 7 天
  refresh-token-expiration: 604800000
