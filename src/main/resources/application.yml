server:
  port: 8080

spring:
  application:
    name: ZHOUYI2
  # 从项目根目录 .env 文件加载环境变量
  config:
    import: optional:file:.env[.properties]

# ===== 大模型配置（OpenAI 兼容格式） =====
llm:
  # API 地址（支持 OpenAI / Azure OpenAI / 通义千问 / DeepSeek 等兼容接口）
  api-url: https://api.deepseek.com
  # API Key — 建议通过环境变量 LLM_API_KEY 注入，避免硬编码
  api-key: ${LLM_API_KEY}
  # 模型名称
  model: deepseek-v4-pro
  # 生成温度 (0.0~1.0)
  temperature: 0.7
  # 最大输出 Token 数
  max-tokens: 1000
  # 请求超时（秒）
  connect-timeout: 10
  read-timeout: 30
